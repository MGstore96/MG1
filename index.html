<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7.00 - 13.52 Webkit by MGstore</title>
<link rel="stylesheet" href="style.css">
<style>
    /* Styling Tampilan Modern & Gaming Theme (Selaras dengan cacheslopkit.html) */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        text-align: center;
    }

    .container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 800px;
        padding: 30px 20px;
        margin: auto;
    }

    /* Logo Styling */
    .logo-container {
        margin-bottom: 15px;
    }

    .logo {
        max-width: 100px;
        height: auto;
        display: block;
        margin: 0 auto;
    
    }

    .header-title {
        color: #e1e8ea;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: none;
        margin-bottom: 25px;
        border-bottom: 2px solid #334155;
        padding-bottom: 15px;
    }

    .status-card {
        background: #0f172a;
        border-radius: 12px;
        border: 1px solid #38bdf8;
        padding: 30px 20px;
        margin: 20px 0;
        box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.1);
    }

    /* msgs secara default berwarna putih (running) */
    #msgs {
        font-size: 22px;
        color: #ffffff; 
        font-weight: 600;
        line-height: 1.5;
        transition: color 0.3s ease;
    }

    /* Class untuk pesan sukses (warna hijau) */
    #msgs.success {
        color: #22c55e !important;
    }

    /* Class untuk pesan error (warna merah) */
    #msgs.error {
        color: #fc0000 !important;
      
    }

    .thanks-section {
        margin-top: 30px;
        font-size: 14px;
        color: #94a3b8;
        border-top: 1px solid #334155;
        padding-top: 20px;
    }

    .thanks-section h3 {
        color: #f00830;
        font-size: 16px;
        margin-bottom: 10px;
    }

    .credits-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }

    .credit-item {
        background: #334155;
        color: #cbd5e1;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
    }

    footer {
        margin-top: 20px;
        font-size: 12px;
        color: #64748b;
    }
</style>
</head>
<body>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

// Helper function untuk mengubah pesan dan warna
function setMsg(htmlContent, type) {
    var msgsElem = document.getElementById("msgs");
    if(!msgsElem) return;
    
    msgsElem.className = ""; // Reset class
    if (type === "success") {
        msgsElem.classList.add("success");
    } else if (type === "error") {
        msgsElem.classList.add("error");
    }
    msgsElem.innerHTML = htmlContent;
}

function onScriptError() {
    setMsg("Konten Tidak Ditemukan! - Hapus Data Browser dan Muat Ulang Cache ...", "error");
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        setMsg("Hanya Untuk PS4 Firmware 7.00 sampai 13.52", "error");
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html")
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                setMsg('Unsupported Firmware: ' + fwVersion, "error");
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);  
        }
    }
}
</script>

<div class="container">
    <!-- Container Logo Tengah Atas -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo MGstore" class="logo">
    </div>

    <div class="header-title">Webkit By MG Store
    
    <div class="status-card">
        <!-- Teks default running berwarna putih -->
        <div id="msgs">Sedang Memuat GoldHEN... Mohon Tunggu</div>
    </div>

    <div class="thanks-section">
        <h3>Special Thanks to:</h3>
        <div class="credits-list">
            <span class="credit-item">GamerHack93</span>
            <span class="credit-item">sleirsgoevy</span>
            <span class="credit-item">TheFlow</span>
            <span class="credit-item">Flatz</span>
            <span class="credit-item">Egycnq</span>
            <span class="credit-item">Jordy</span>
            <span class="credit-item">Sonic-Iso</span>
            <span class="credit-item">Feyzee61</span>
            <span class="credit-item">AlAzif</span>
            <span class="credit-item">ChendoChap</span>
            <span class="credit-item">Kameleonre_</span>
            <span class="credit-item">SiSTR0</span>
        </div>
    </div>
</div>

<footer>
    <p>&copy; MGstore Webkit Host</p>
</footer>

</body>
</html>
